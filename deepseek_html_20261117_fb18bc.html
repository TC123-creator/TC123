<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 日本語學習樂園 🌸 第1-5課</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Sans JP', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  color: #333;
  padding: 16px;
}
.container { max-width: 1100px; margin: 0 auto; }

/* Header */
header {
  text-align: center;
  color: white;
  padding: 24px 16px 16px;
}
header h1 {
  font-size: 2.2em;
  text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
  margin-bottom: 6px;
  letter-spacing: 2px;
}
header p {
  font-size: 1em;
  opacity: 0.9;
}

/* Score */
.score-bar {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 12px 0;
}
.score-item {
  background: rgba(255,255,255,0.2);
  color: white;
  padding: 8px 20px;
  border-radius: 20px;
  font-size: 0.95em;
  backdrop-filter: blur(10px);
}
.score-item span { font-weight: bold; font-size: 1.1em; }

/* Tabs */
.tabs-section {
  background: white;
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.15);
}
.tab-group { margin-bottom: 10px; }
.tab-group:last-child { margin-bottom: 0; }
.tab-group-label {
  font-size: 0.8em;
  color: #999;
  margin-bottom: 6px;
  padding-left: 4px;
  font-weight: bold;
  letter-spacing: 1px;
}
.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.tab-btn {
  padding: 10px 18px;
  border: 2px solid #e0e0e0;
  background: white;
  border-radius: 12px;
  cursor: pointer;
  font-size: 0.95em;
  font-family: inherit;
  transition: all 0.2s;
  font-weight: 500;
}
.tab-btn:hover {
  border-color: #667eea;
  transform: translateY(-1px);
}
.tab-btn.active {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border-color: transparent;
  box-shadow: 0 4px 15px rgba(102,126,234,0.4);
}
.tab-btn.mode-btn.active {
  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  box-shadow: 0 4px 15px rgba(245,87,108,0.4);
}

/* Main content */
#content {
  background: white;
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.15);
  min-height: 400px;
}

/* Section title */
.section-title {
  font-size: 1.3em;
  color: #2c3e50;
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 3px solid #667eea;
  display: inline-block;
}

/* Vocab grid */
.vocab-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
}
.vocab-card {
  background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
  border-radius: 14px;
  padding: 14px;
  position: relative;
  cursor: pointer;
  transition: all 0.25s;
  border: 2px solid transparent;
}
.vocab-card:hover {
  transform: translateY(-4px) scale(1.02);
  box-shadow: 0 8px 25px rgba(0,0,0,0.15);
  border-color: #667eea;
}
.vocab-jp {
  font-size: 1.35em;
  font-weight: 700;
  color: #2c3e50;
  margin-bottom: 4px;
  padding-right: 32px;
  line-height: 1.3;
}
.vocab-ro {
  color: #e74c3c;
  font-size: 0.85em;
  font-style: italic;
  margin-bottom: 4px;
}
.vocab-cn {
  color: #555;
  font-size: 0.9em;
}
.speak-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  background: #667eea;
  color: white;
  border: none;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  box-shadow: 0 2px 8px rgba(102,126,234,0.4);
}
.speak-btn:hover {
  background: #5568d3;
  transform: scale(1.1);
}
.speak-btn:active {
  transform: scale(0.95);
}

/* Quiz */
.quiz-box {
  max-width: 700px;
  margin: 0 auto;
}
.quiz-progress {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  color: #666;
  font-size: 0.9em;
}
.progress-bar {
  flex: 1;
  height: 8px;
  background: #e0e0e0;
  border-radius: 4px;
  margin: 0 12px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #667eea, #764ba2);
  border-radius: 4px;
  transition: width 0.4s;
}
.question-card {
  background: #f8f9fa;
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 16px;
  text-align: center;
}
.question-label {
  color: #999;
  font-size: 0.85em;
  margin-bottom: 8px;
}
.question-text {
  font-size: 1.5em;
  font-weight: bold;
  color: #2c3e50;
  margin-bottom: 8px;
}
.question-sub {
  color: #e74c3c;
  font-style: italic;
  font-size: 0.95em;
  margin-bottom: 8px;
}
.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 16px;
}
.option-btn {
  padding: 14px;
  border: 2px solid #e0e0e0;
  background: white;
  border-radius: 12px;
  cursor: pointer;
  font-size: 1em;
  font-family: inherit;
  transition: all 0.2s;
  text-align: center;
}
.option-btn:hover:not(:disabled) {
  border-color: #667eea;
  background: #f0f3ff;
  transform: translateY(-2px);
}
.option-btn.correct {
  background: #d4edda;
  border-color: #28a745;
  color: #155724;
  font-weight: bold;
}
.option-btn.wrong {
  background: #f8d7da;
  border-color: #dc3545;
  color: #721c24;
}
.option-btn:disabled { cursor: default; }

.feedback {
  margin-top: 16px;
  padding: 14px;
  border-radius: 12px;
  font-size: 0.95em;
  animation: fadeIn 0.3s;
}
.feedback.correct {
  background: #d4edda;
  color: #155724;
  border-left: 4px solid #28a745;
}
.feedback.wrong {
  background: #f8d7da;
  color: #721c24;
  border-left: 4px solid #dc3545;
}
.feedback .fb-title { font-weight: bold; margin-bottom: 4px; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

/* Write mode */
.write-input {
  width: 100%;
  padding: 14px;
  font-size: 1.2em;
  border: 2px solid #e0e0e0;
  border-radius: 12px;
  font-family: inherit;
  text-align: center;
  margin-top: 12px;
  transition: border-color 0.2s;
}
.write-input:focus {
  outline: none;
  border-color: #667eea;
}
.submit-btn {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 1.05em;
  font-family: inherit;
  cursor: pointer;
  font-weight: bold;
  transition: transform 0.2s;
}
.submit-btn:hover { transform: translateY(-2px); }
.submit-btn:disabled { opacity: 0.5; cursor: default; transform: none; }

/* Speak mode */
.speak-card {
  text-align: center;
  padding: 30px 20px;
}
.speak-jp {
  font-size: 2.5em;
  font-weight: bold;
  color: #2c3e50;
  margin-bottom: 12px;
  letter-spacing: 2px;
}
.speak-ro {
  font-size: 1.2em;
  color: #e74c3c;
  font-style: italic;
  margin-bottom: 8px;
}
.speak-cn {
  font-size: 1.1em;
  color: #666;
  margin-bottom: 24px;
}
.big-play-btn {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border: none;
  border-radius: 50%;
  width: 80px;
  height: 80px;
  font-size: 2em;
  cursor: pointer;
  box-shadow: 0 8px 25px rgba(102,126,234,0.4);
  transition: all 0.2s;
  margin: 8px;
}
.big-play-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 12px 35px rgba(102,126,234,0.5);
}
.big-play-btn:active { transform: scale(0.95); }
.speak-nav {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 20px;
}
.nav-btn {
  padding: 10px 20px;
  background: white;
  border: 2px solid #667eea;
  color: #667eea;
  border-radius: 10px;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.95em;
  font-weight: bold;
  transition: all 0.2s;
}
.nav-btn:hover {
  background: #667eea;
  color: white;
}
.nav-btn:disabled {
  opacity: 0.3;
  cursor: default;
}

/* Grammar section */
.grammar-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.grammar-item {
  background: linear-gradient(135deg, #fff5e6 0%, #ffe4e1 100%);
  border-radius: 14px;
  padding: 16px;
  border-left: 5px solid #ff6b6b;
}
.grammar-pattern {
  font-size: 1.15em;
  font-weight: bold;
  color: #c0392b;
  margin-bottom: 6px;
}
.grammar-meaning {
  color: #2c3e50;
  margin-bottom: 8px;
  font-weight: 500;
}
.grammar-example {
  color: #555;
  font-size: 0.95em;
  line-height: 1.7;
}
.grammar-example .jp { color: #2c3e50; font-weight: 500; }
.grammar-example .ro { color: #e74c3c; font-style: italic; font-size: 0.9em; }

/* Result screen */
.result-screen {
  text-align: center;
  padding: 30px;
}
.result-emoji { font-size: 5em; margin-bottom: 10px; animation: bounce 1s infinite; }
@keyframes bounce {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
.result-score {
  font-size: 2em;
  font-weight: bold;
  color: #667eea;
  margin-bottom: 10px;
}
.result-msg {
  color: #666;
  margin-bottom: 24px;
  font-size: 1.1em;
}

@media (max-width: 600px) {
  header h1 { font-size: 1.6em; }
  .vocab-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .options { grid-template-columns: 1fr; }
  .speak-jp { font-size: 1.8em; }
  #content { padding: 16px; }
  .tab-btn { padding: 8px 14px; font-size: 0.85em; }
}
</style>
</head>

</div>

// ============ 狀態 ============
let currentLesson = 1;
let currentMode = 'read';
let totalScore = 0;
let streak = 0;
let speakIndex = 0;
let quizState = null;

// ============ 語音合成 ============
let voicesReady = false;
function initVoices() {
  if (speechSynthesis.getVoices().length > 0) voicesReady = true;
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = initVoices;
  initVoices();
}

function speak(text) {
  if (!('speechSynthesis' in window)) {
    alert('你的瀏覽器不支援語音功能，建議使用 Chrome 或 Edge。');
    return;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = 0.75;
  u.pitch = 1;
  const voices = speechSynthesis.getVoices();
  const jaVoice = voices.find(v => v.lang === 'ja-JP') || voices.find(v => v.lang.startsWith('ja'));
  if (jaVoice) u.voice = jaVoice;
  speechSynthesis.speak(u);
}

// ============ 工具函數 ============
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function updateScoreBar() {
  document.getElementById('totalScore').textContent = totalScore;
  document.getElementById('streak').textContent = streak;
}

function addScore(correct) {
  if (correct) {
    streak++;
    totalScore += 10 + streak * 2;
  } else {
    streak = 0;
  }
  updateScoreBar();
}

// ============ 渲染函數 ============
function render() {
  const content = document.getElementById('content');
  if (currentMode === 'read') renderRead(content);
  else if (currentMode === 'listen') renderQuiz(content, 'listen');
  else if (currentMode === 'speak') renderSpeak(content);
  else if (currentMode === 'write') renderWrite(content);
  else if (currentMode === 'grammar') renderGrammar(content);
}

// ---- 讀 ----
function renderRead(el) {
  const data = vocabData[currentLesson];
  el.innerHTML = `
    <div class="section-title">📖 第${currentLesson}課 單字（${data.length}個）</div>
    <p style="color:#888;font-size:0.9em;margin-bottom:16px;">點擊卡片朗讀發音 🔊</p>
    <div class="vocab-grid">
      ${data.map((v, i) => `
        <div class="vocab-card" onclick="speak('${v.jp.replace(/'/g, "\\'")}')">
          <button class="speak-btn" onclick="event.stopPropagation();speak('${v.jp.replace(/'/g, "\\'")}')">🔊</button>
          <div class="vocab-jp">${v.jp}</div>
          <div class="vocab-ro">${v.ro}</div>
          <div class="vocab-cn">${v.cn}</div>
        </div>
      `).join('')}
    </div>
  `;
}

// ---- 聽（聽音選日文） ----
function renderQuiz(el, type) {
  if (!quizState || quizState.type !== type || quizState.lesson !== currentLesson) {
    startQuiz(type);
  }
  drawQuiz(el);
}

function startQuiz(type) {
  const pool = vocabData[currentLesson];
  const questions = shuffle(pool).slice(0, Math.min(10, pool.length));
  quizState = {
    type: type,
    lesson: currentLesson,
    questions: questions,
    index: 0,
    correctCount: 0,
    answered: false
  };
}

function drawQuiz(el) {
  const q = quizState;
  if (q.index >= q.questions.length) {
    drawResult(el);
    return;
  }
  const item = q.questions[q.index];
  const pool = vocabData[currentLesson];
  const otherOptions = shuffle(pool.filter(v => v.jp !== item.jp)).slice(0, 3);
  const options = shuffle([item, ...otherOptions]);

  let questionHTML = '';
  if (q.type === 'listen') {
    questionHTML = `
      <div class="question-label">👂 聽發音，選出正確的日文</div>
      <button class="big-play-btn" onclick="speak('${item.jp.replace(/'/g, "\\'")}')">🔊</button>
      <div style="margin-top:16px;color:#999;font-size:0.85em;">（可以重複點擊播放）</div>
    `;
  }

  el.innerHTML = `
    <div class="quiz-box">
      <div class="quiz-progress">
        <span>第 ${q.index + 1} / ${q.questions.length} 題</span>
        <div class="progress-bar"><div class="progress-fill" style="width:${(q.index / q.questions.length) * 100}%"></div></div>
        <span>✅ ${q.correctCount}</span>
      </div>
      <div class="question-card">
        ${questionHTML}
      </div>
      <div class="options" id="options">
        ${options.map((opt, i) => `
          <button class="option-btn" data-jp="${opt.jp}" onclick="checkAnswer(this, '${opt.jp.replace(/'/g, "\\'")}', '${item.jp.replace(/'/g, "\\'")}', '${q.type}')">${opt.jp}</button>
        `).join('')}
      </div>
      <div id="feedback"></div>
    </div>
  `;
}

function checkAnswer(btn, chosen, correct, type) {
  if (quizState.answered) return;
  quizState.answered = true;
  const buttons = document.querySelectorAll('#options .option-btn');
  const isCorrect = chosen === correct;
  buttons.forEach(b => {
    b.disabled = true;
    if (b.dataset.jp === correct) b.classList.add('correct');
    else if (b === btn) b.classList.add('wrong');
  });
  const item = vocabData[quizState.lesson].find(v => v.jp === correct);
  const fb = document.getElementById('feedback');
  if (isCorrect) {
    quizState.correctCount++;
    addScore(true);
    fb.innerHTML = `<div class="feedback correct">
      <div class="fb-title">✅ 答對了！ +${10 + streak * 2} 分</div>
      <div><b>${item.jp}</b>（${item.ro}）＝ ${item.cn}</div>
    </div>`;
  } else {
    addScore(false);
    fb.innerHTML = `<div class="feedback wrong">
      <div class="fb-title">❌ 答錯了</div>
      <div>正確答案：<b>${item.jp}</b>（${item.ro}）＝ ${item.cn}</div>
    </div>`;
  }
  // 朗讀正確答案
  setTimeout(() => speak(correct), 300);
  // 下一題按鈕
  const nextBtn = document.createElement('button');
  nextBtn.className = 'submit-btn';
  nextBtn.textContent = quizState.index < quizState.questions.length - 1 ? '下一題 →' : '查看結果 →';
  nextBtn.onclick = () => {
    quizState.index++;
    quizState.answered = false;
    drawQuiz(document.getElementById('content'));
  };
  fb.appendChild(nextBtn);
}

function drawResult(el) {
  const q = quizState;
  const percent = q.correctCount / q.questions.length;
  let emoji, msg;
  if (percent === 1) { emoji = '🏆'; msg = '太厲害了！全對！你根本是日文天才！'; }
  else if (percent >= 0.8) { emoji = '🎉'; msg = '很棒！繼續保持！'; }
  else if (percent >= 0.6) { emoji = '💪'; msg = '不錯喔！再複習一下會更好！'; }
  else { emoji = '📚'; msg = '別灰心，多看幾次卡片再來挑戰！'; }

  el.innerHTML = `
    <div class="result-screen">
      <div class="result-emoji">${emoji}</div>
      <div class="result-score">${q.correctCount} / ${q.questions.length}</div>
      <div class="result-msg">${msg}</div>
      <button class="submit-btn" style="max-width:300px;margin:0 auto;" onclick="startQuiz('${q.type}');drawQuiz(document.getElementById('content'))">🔄 再挑戰一次</button>
    </div>
  `;
}

// ---- 說 ----
function renderSpeak(el) {
  const data = vocabData[currentLesson];
  if (speakIndex >= data.length) speakIndex = 0;
  const item = data[speakIndex];
  el.innerHTML = `
    <div class="section-title">🗣️ 說 第${currentLesson}課（第 ${speakIndex + 1} / ${data.length} 個）</div>
    <div class="speak-card">
      <div class="speak-jp">${item.jp}</div>
      <div class="speak-ro">${item.ro}</div>
      <div class="speak-cn">${item.cn}</div>
      <button class="big-play-btn" onclick="speak('${item.jp.replace(/'/g, "\\'")}')">🔊</button>
      <p style="color:#888;margin-top:16px;font-size:0.9em;">👆 點擊播放，跟著大聲朗讀吧！</p>
      <div class="speak-nav">
        <button class="nav-btn" onclick="speakNav(-1)" ${speakIndex === 0 ? 'disabled' : ''}>← 上一個</button>
        <button class="nav-btn" onclick="speakNav(1)">下一個 →</button>
      </div>
    </div>
  `;
}

function speakNav(dir) {
  const data = vocabData[currentLesson];
  speakIndex += dir;
  if (speakIndex < 0) speakIndex = 0;
  if (speakIndex >= data.length) speakIndex = data.length - 1;
  renderSpeak(document.getElementById('content'));
}

// ---- 寫 ----
function renderWrite(el) {
  if (!quizState || quizState.type !== 'write' || quizState.lesson !== currentLesson) {
    const pool = vocabData[currentLesson];
    const questions = shuffle(pool).slice(0, Math.min(10, pool.length));
    quizState = {
      type: 'write',
      lesson: currentLesson,
      questions: questions,
      index: 0,
      correctCount: 0,
      answered: false
    };
  }
  const q = quizState;
  if (q.index >= q.questions.length) { drawResult(el); return; }
  const item = q.questions[q.index];

  el.innerHTML = `
    <div class="quiz-box">
      <div class="quiz-progress">
        <span>第 ${q.index + 1} / ${q.questions.length} 題</span>
        <div class="progress-bar"><div class="progress-fill" style="width:${(q.index / q.questions.length) * 100}%"></div></div>
        <span>✅ ${q.correctCount}</span>
      </div>
      <div class="question-card">
        <div class="question-label">✍️ 看中文，寫出日文（可輸入日文或羅馬字）</div>
        <div class="question-text" style="color:#c0392b;">${item.cn}</div>
        <div class="question-sub">${item.ro}</div>
      </div>
      <input type="text" class="write-input" id="writeInput" placeholder="在這裡輸入日文…" autocomplete="off">
      <button class="submit-btn" id="submitWrite" onclick="checkWrite()">確認答案</button>
      <div id="feedback"></div>
    </div>
  `;
  const input = document.getElementById('writeInput');
  input.focus();
  input.addEventListener('keydown', e => { if (e.key === 'Enter') checkWrite(); });
}

function checkWrite() {
  if (quizState.answered) return;
  const input = document.getElementById('writeInput');
  const userAns = input.value.trim().toLowerCase();
  if (!userAns) return;
  quizState.answered = true;
  const item = quizState.questions[quizState.index];
  // 比對：接受日文或羅馬字（忽略空格、大小寫）
  const normalize = s => s.replace(/\s+/g, '').toLowerCase();
  const isCorrect = normalize(userAns) === normalize(item.jp) || normalize(userAns) === normalize(item.ro);
  input.disabled = true;
  document.getElementById('submitWrite').disabled = true;

  const fb = document.getElementById('feedback');
  if (isCorrect) {
    quizState.correctCount++;
    addScore(true);
    fb.innerHTML = `<div class="feedback correct">
      <div class="fb-title">✅ 答對了！ +${10 + streak * 2} 分</div>
      <div>正確答案：<b>${item.jp}</b>（${item.ro}）</div>
    </div>`;
  } else {
    addScore(false);
    fb.innerHTML = `<div class="feedback wrong">
      <div class="fb-title">❌ 答錯了</div>
      <div>你的答案：${userAns}</div>
      <div>正確答案：<b>${item.jp}</b>（${item.ro}）＝ ${item.cn}</div>
    </div>`;
  }
  setTimeout(() => speak(item.jp), 300);

  const nextBtn = document.createElement('button');
  nextBtn.className = 'submit-btn';
  nextBtn.textContent = quizState.index < quizState.questions.length - 1 ? '下一題 →' : '查看結果 →';
  nextBtn.onclick = () => {
    quizState.index++;
    quizState.answered = false;
    renderWrite(document.getElementById('content'));
  };
  fb.appendChild(nextBtn);
}

// ---- 文法 ----
function renderGrammar(el) {
  const data = grammarData[currentLesson];
  el.innerHTML = `
    <div class="section-title">📝 第${currentLesson}課 文法重點</div>
    <div class="grammar-list">
      ${data.map(g => `
        <div class="grammar-item">
          <div class="grammar-pattern">${g.pattern}</div>
          <div class="grammar-meaning">→ ${g.meaning}</div>
          <div class="grammar-example">${g.example}</div>
        </div>
      `).join('')}
    </div>
  `;
}

// ============ 事件綁定 ============
document.getElementById('lessonTabs').addEventListener('click', e => {
  if (!e.target.classList.contains('tab-btn')) return;
  document.querySelectorAll('#lessonTabs .tab-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  currentLesson = parseInt(e.target.dataset.lesson);
  speakIndex = 0;
  quizState = null;
  render();
});

document.getElementById('modeTabs').addEventListener('click', e => {
  if (!e.target.classList.contains('tab-btn')) return;
  document.querySelectorAll('#modeTabs .tab-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  currentMode = e.target.dataset.mode;
  quizState = null;
  render();
});

// ============ 初始化 ============
updateScoreBar();
render();
</script>
</body>
</html>
