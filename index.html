<style>

<body>
<div class="container">
  <header>
    <h1>🌸 日語學習樂園 🌸</h1>
    <p>廣東話詳細教程 × 聽講讀寫 × 第1-6課 × 每課約85題</p>
  </header>
  <div class="score-bar">
    <div class="score-item">🏆 總分 <span id="totalScore">0</span></div>
    <div class="score-item">🔥 連對 <span id="streak">0</span></div>
    <div class="score-item">✅ 答對 <span id="correctCount">0</span></div>
  </div>
  <div class="speed-bar">
    <label>🗣️ 語速</label>
    <input type="range" id="speedSlider" min="0.5" max="5" step="0.1" value="1">
    <span class="speed-val" id="speedVal">1.0x</span>
    <div class="speed-preset">
      <button onclick="setSpeed(0.5)">0.5x</button>
      <button onclick="setSpeed(0.75)">0.75x</button>
      <button onclick="setSpeed(1)">1x</button>
      <button onclick="setSpeed(1.5)">1.5x</button>
      <button onclick="setSpeed(2)">2x</button>
      <button onclick="setSpeed(3)">3x</button>
      <button onclick="setSpeed(5)">5x</button>
    </div>
  </div>
  <div class="lesson-bar" id="lessonBar"></div>
  <div class="mode-bar">
    <button class="mode-btn active" data-mode="listen">🎧 聽教程</button>
    <button class="mode-btn" data-mode="read">📖 看教程</button>
    <button class="mode-btn" data-mode="quiz">✏️ 做練習</button>
  </div>
  <div id="content"></div>
</div>

<script>
/* ============ 語速控制 ============ */
let speechRate = 1.0;
function setSpeed(v){
  speechRate = v;
  document.getElementById('speedSlider').value = v;
  document.getElementById('speedVal').textContent = v.toFixed(1)+'x';
  if('speechSynthesis' in window) speechSynthesis.cancel();
}
document.getElementById('speedSlider').addEventListener('input', function(){
  speechRate = parseFloat(this.value);
  document.getElementById('speedVal').textContent = speechRate.toFixed(1)+'x';
});

/* ============ 語音 ============ */
let voicesReady=false;
function initVoices(){ if(speechSynthesis.getVoices().length>0) voicesReady=true; }
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=initVoices; initVoices(); }
function pickVoice(lang){
  const vs=speechSynthesis.getVoices();
  let v=vs.find(x=>x.lang===lang);
  if(!v) v=vs.find(x=>x.lang.startsWith(lang.split('-')[0]));
  return v||null;
}
function speak(text,lang,onEnd){
  if(!('speechSynthesis' in window)){ if(onEnd)onEnd(); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang; u.rate=speechRate; u.pitch=1;
  const v=pickVoice(lang); if(v)u.voice=v;
  if(onEnd)u.onend=onEnd;
  speechSynthesis.speak(u);
}
let audioCtx=null;
function beep(type){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    if(type==='correct'){o.frequency.value=880;g.gain.setValueAtTime(.15,audioCtx.currentTime);o.type='sine';}
    else{o.frequency.value=220;g.gain.setValueAtTime(.15,audioCtx.currentTime);o.type='sawtooth';}
    o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.25);o.stop(audioCtx.currentTime+.26);
  }catch(e){}
}
function updateScoreBar(){
  document.getElementById('totalScore').textContent=totalScore;
  document.getElementById('streak').textContent=streak;
  document.getElementById('correctCount').textContent=correctCount;
}

/* ============ 狀態 ============ */
let currentLesson=1, currentMode='listen';
let totalScore=0, streak=0, correctCount=0;
let listenPlaying=false, listenIndex=0, listenTimer=null;

/* ============ 資料 ============ */
const LESSONS = {
1:{
title:"第1課：はじめまして",
tutorial:[
{c:"歡迎嚟到第一課。今課我哋會學自我介紹、人稱代名詞、同埋基本嘅肯定否定句型。",j:""},
{c:"第一個字係「わたし」，讀做 watashi。",j:"わたし"},
{c:"「わたし」嘅漢字寫做「私」，意思係「我」，男女都用得，係最普遍嘅自稱。",j:""},
{c:"例如「わたしは がくせい です」，即係「我係學生」。",j:"わたしは がくせい です"},
{c:"跟住係「あなた」，讀做 anata，意思係「你」。",j:"あなた"},
{c:"不過要留意，日本人好少直接叫對方「あなた」，通常會叫對方嘅姓氏加「さん」，咁樣禮貌好多。",j:""},
{c:"「あのひと」讀做 ano hito，意思係「那個人」，用嚟指離雙方都遠嘅人。",j:"あのひと"},
{c:"「あのかた」讀做 ano kata，係「あのひと」嘅禮貌版，用嚟指值得尊敬嘅人。",j:"あのかた"},
{c:"「さん」讀做 san，係最常用嘅敬稱，接喺姓氏後面，例如「やまださん」。",j:"さん"},
{c:"「ちゃん」讀做 chan，係暱稱，用嚟叫小朋友或者親密嘅朋友，例如「たろうちゃん」。",j:"ちゃん"},
{c:"「じん」讀做 jin，接喺國名後面表示國籍，例如「にほんじん」即係日本人。",j:"じん"},
{c:"「せんせい」讀做 sensei，係老師、醫生、律師等專業人士嘅尊稱。",j:"せんせい"},
{c:"「きょうし」讀做 kyoushi，係「教師」呢個職業嘅名稱，唔係稱呼用語。",j:"きょうし"},
{c:"「がくせい」讀做 gakusei，意思係學生。例如「わたしは がくせい です」。",j:"がくせい"},
{c:"「かいしゃいん」讀做 kaishain，意思係公司職員。例如「わたしは かいしゃいん です」。",j:"かいしゃいん"},
{c:"「ぎんこういん」讀做 ginkouin，係銀行行員。「いしゃ」讀做 isha，係醫生。",j:"ぎんこういん、いしゃ"},
{c:"「けんきゅうしゃ」讀做 kenkyuusha，係研究人員。「だいがく」係大學，「びょういん」係醫院。",j:"けんきゅうしゃ、だいがく、びょういん"},
{c:"「だれ」讀做 dare，係「誰」。「どなた」讀做 donata，係「哪位」嘅禮貌講法。",j:"だれ、どなた"},
{c:"「なんさい」讀做 nansai，係問「幾歲」。「おいくつ」係更禮貌嘅問法。",j:"なんさい、おいくつ"},
{c:"「はい」係「係」，「いいえ」係「唔係」。",j:"はい、いいえ"},
{c:"「はじめまして」係初次見面嘅開場白。「どうぞ よろしく おねがいします」係「請多多關照」。",j:"はじめまして、どうぞ よろしく おねがいします"},
{c:"「おはよう ございます」係早晨嘅問候。",j:"おはよう ございます"},
{c:"跟住講文法。第一個句型係「AはBです」，意思係「A係B」。",j:""},
{c:"「は」係主題標記助詞，讀音係 wa，唔係 ha。例如「わたしは がくせい です」。",j:"わたしは がくせい です"},
{c:"第二個句型係否定句：「AはBじゃありません」或者「ではありません」，意思係「A唔係B」。",j:"わたしは せんせい じゃ ありません"},
{c:"第三個句型係疑問句：「AはBですか」，句尾加「か」表示疑問。",j:"あなたは がくせい ですか"},
{c:"回答肯定用「はい、そうです」或者「はい、がくせいです」。否定用「いいえ、ちがいます」。",j:""},
{c:"「の」表示所屬，例如「パワーでんき の しゃいん」即係「電力公司嘅職員」。",j:"パワーでんき の しゃいん"},
{c:"「～からきました」表示「從～嚟」，例如「アメリカ から きました」即係「從美國嚟」。",j:"アメリカ から きました"},
{c:"最後，自我介紹嘅標準流程係：先講「はじめまして」，然後講自己個名，再講出身地同職業，最後講「どうぞ よろしく おねがいします」。",j:""}
],

2:{
title:"第2課：これ・それ・あれ",
tutorial:[
{c:"歡迎嚟到第二課。今課我哋會學指示代名詞，即係「呢個」「嗰個」嘅講法，同埋一啲日常物品嘅名稱。",j:""},
{c:"「これ」讀做 kore，意思係「這個」，指近說話者嘅物品。例如「これは ほん です」即係「呢個係書」。",j:"これは ほん です"},
{c:"「それ」讀做 sore，意思係「那個」，指近聽話者嘅物品。例如「それは なんですか」即係「嗰個係咩？」。",j:"それは なんですか"},
{c:"「あれ」讀做 are，意思係「那個」，指離雙方都遠嘅物品。",j:"あれ"},
{c:"「この」讀做 kono，係連體詞，後面一定要接名詞，例如「このほん」即係「這本書」。",j:"このほん"},
{c:"「その」讀做 sono，後面接名詞，例如「そのかばん」即係「那個包包」。",j:"そのかばん"},
{c:"「あの」讀做 ano，後面接名詞，例如「あのひと」即係「那個人」。",j:"あのひと"},
{c:"「ほん」讀做 hon，意思係書。「じしょ」讀做 jisho，意思係字典。",j:"ほん、じしょ"},
{c:"「ざっし」讀做 zasshi，意思係雜誌。「しんぶん」讀做 shinbun，意思係報紙。",j:"ざっし、しんぶん"},
{c:"「ノート」讀做 nooto，係筆記本。「てちょう」讀做 techou，係記事本。「めいし」讀做 meishi，係名片。",j:"ノート、てちょう、めいし"},
{c:"「えんぴつ」讀做 enpitsu，係鉛筆。「ボールペン」係原子筆。「シャープペンシル」係自動鉛筆。",j:"えんぴつ、ボールペン、シャープペンシル"},
{c:"「かぎ」讀做 kagi，係鑰匙。「とけい」讀做 tokei，係時鐘或者手錶。",j:"かぎ、とけい"},
{c:"「かさ」讀做 kasa，係雨傘。「かばん」讀做 kaban，係包包。",j:"かさ、かばん"},
{c:"「テレビ」係電視，「ラジオ」係收音機，「カメラ」係照相機，「コンピューター」係電腦。",j:"テレビ、ラジオ、カメラ、コンピューター"},
{c:"「くるま」讀做 kuruma，係車。「つくえ」讀做 tsukue，係桌子。「いす」讀做 isu，係椅子。",j:"くるま、つくえ、いす"},
{c:"「チョコレート」係巧克力，「コーヒー」係咖啡，「おみやげ」係伴手禮。",j:"チョコレート、コーヒー、おみやげ"},
{c:"「えいご」係英文，「にほんご」係日文。",j:"えいご、にほんご"},
{c:"「なん」讀做 nan，係「咩」。「そう」讀做 sou，係「係咁樣」。",j:"なん、そう"},
{c:"跟住講文法。第一個句型係「これ／それ／あれは～です」，用嚟指出物品。",j:""},
{c:"第二個句型係「この／その／あの＋名詞」，用嚟修飾名詞。記住「この」後面一定要接名詞。",j:"このほん"},
{c:"第三個句型係「～は なんですか」，用嚟問「～係咩？」。回答直接講物品名稱就得。",j:"それは なんですか"},
{c:"如果對方估錯咗，我哋可以講「ちがいます」，即係「唔係」。",j:"ちがいます"},
{c:"「どうぞ」係遞嘢畀人時講嘅「請」。「どうも ありがとう ございます」係「非常感謝」。",j:"どうぞ、どうも ありがとう ございます"},
{c:"「あのう」係引起注意嘅「嗯…」，「えっ」係表示驚訝嘅「咦？」。",j:"あのう、えっ"}
],

title:"第3課：ここ・そこ・あそこ",
tutorial:[
{c:"歡迎嚟到第三課。今課我哋會學場所指示詞，同埋購物用語。",j:""},
{c:"「ここ」讀做 koko，意思係「這裡」，指說話者所在嘅地方。",j:"ここ"},
{c:"「そこ」讀做 soko，意思係「那裡」，指聽話者附近嘅地方。",j:"そこ"},
{c:"「あそこ」讀做 asoko，意思係「那裡」，指離雙方都遠嘅地方。",j:"あそこ"},
{c:"「どこ」讀做 doko，意思係「哪裡」。",j:"どこ"},
{c:"「こちら」「そちら」「あちら」「どちら」係禮貌版，分別對應ここ、そこ、あそこ、どこ。",j:"こちら、そちら、あちら、どちら"},
{c:"「きょうしつ」讀做 kyoushitsu，意思係教室。「しょくどう」讀做 shokudou，意思係食堂。",j:"きょうしつ、しょくどう"},
{c:"「じむしょ」係辦公室，「かいぎしょ」係會議室，「うけつけ」係接待處。",j:"じむしょ、かいぎしょ、うけつけ"},
{c:"「ロビー」係大廳，「へや」係房間。「トイレ」係廁所，「おてあらい」係更禮貌嘅講法。",j:"ロビー、へや、トイレ、おてあらい"},
{c:"「かいだん」係樓梯，「エスカレーター」係電扶梯。「じどうはんばいき」係自動販賣機。",j:"かいだん、エスカレーター、じどうはんばいき"},
{c:"「でんわ」係電話，「くつ」係鞋，「くつした」係襪，「ネクタイ」係領帶，「ワイン」係葡萄酒。",j:"でんわ、くつ、くつした、ネクタイ、ワイン"},
{c:"「うりば」係賣場，「ちか」係地下，「なんがい」係幾樓。",j:"うりば、ちか、なんがい"},
{c:"「えん」係日圓，「いくら」係問價錢。「ひゃく」係百，「せん」係千，「まん」係萬。",j:"えん、いくら、ひゃく、せん、まん"},
{c:"購物時想睇商品，可以講「それを みせてください」。",j:"それを みせてください"},
{c:"想買就講「これを ください」，即係「請畀我呢個」。",j:"これを ください"},
{c:"問價錢講「いくらですか」，例如「これは いくらですか」。",j:"これは いくらですか"},
{c:"「いらっしゃいませ」係店員歡迎顧客嘅講法。",j:"いらっしゃいませ"},
{c:"「すみません」可以用嚟道歉或者引起注意，類似英文嘅 excuse me。",j:"すみません"},
{c:"跟住講文法。第一個句型係「ここ／そこ／あそことは～です」，用嚟指出場所。",j:""},
{c:"第二個句型係「～は どこですか」，用嚟問「～喺邊度？」。",j:"トイレは どこですか"},
{c:"第三個句型係「～を ください」，用嚟請求物品。",j:"これを ください"},
{c:"第四個句型係「～を みせて ください」，用嚟要求睇商品。",j:"それを みせて ください"},
{c:"第五個句型係「～は いくらですか」，用嚟問價錢。",j:"これは いくらですか"},
{c:"「じゃ」係「那麼」，用於轉換話題或者道別。",j:"じゃ"}
],

title:"第4課：おきます・ねます（動詞與時間）",
tutorial:[
{c:"歡迎嚟到第四課。今課我哋會學動詞嘅ます形、時間表達、同埋星期。",j:""},
{c:"「おきます」讀做 okimasu，意思係起床。例如「まいあさ 6じに おきます」。",j:"おきます"},
{c:"「ねます」讀做 nemasu，意思係睡覺。例如「まいばん 11じに ねます」。",j:"ねます"},
{c:"「はたらきます」讀做 hatarakimasu，意思係工作。",j:"はたらきます"},
{c:"「やすみます」讀做 yasumimasu，意思係休息。",j:"やすみます"},
{c:"「べんきょうします」讀做 benkyoushimasu，意思係學習。",j:"べんきょうします"},
{c:"「おわります」讀做 owarimasu，意思係結束。",j:"おわります"},
{c:"時間方面，「いま」係現在，「なんじ」係幾點。「じ」係點，「ふん」或者「ぷん」係分。",j:"いま、なんじ"},
{c:"「ごぜん」係上午，「ごご」係下午。「あさ」係朝早，「ひる」係中午，「ばん」係晚上。",j:"ごぜん、ごご、あさ、ひる、ばん"},
{c:"日期方面，「きのう」係昨天，「きょう」係今天，「あした」係明天。",j:"きのう、きょう、あした"},
{c:"「おととい」係前天，「あさって」係後天。「けさ」係今朝，「こんばん」係今晚。",j:"おととい、あさって、けさ、こんばん"},
{c:"星期方面，「げつようび」係星期一，「かようび」係星期二，「すいようび」係星期三。",j:"げつようび、かようび、すいようび"},
{c:"「もくようび」係星期四，「きんようび」係星期五，「どようび」係星期六，「にちようび」係星期日。",j:"もくようび、きんようび、どようび、にちようび"},
{c:"「なんようび」係問「星期幾」。",j:"なんようび"},
{c:"「デパート」係百貨公司，「ぎんこう」係銀行，「ゆうびんきょく」係郵局。",j:"デパート、ぎんこう、ゆうびんきょく"},
{c:"「としょかん」係圖書館，「びじゅつかん」係美術館。",j:"としょかん、びじゅつかん"},
{c:"「しけん」係考試，「かいぎ」係會議，「えいが」係電影。",j:"しけん、かいぎ、えいが"},
{c:"「まいあさ」係每天早上，「まいばん」係每天晚上，「まいにち」係每天。",j:"まいあさ、まいばん、まいにち"},
{c:"跟住講文法。動詞ます形有四種時態：ます、ません、ました、ませんでした。",j:""},
{c:"「ます」係現在肯定，「ません」係現在否定，「ました」係過去肯定，「ませんでした」係過去否定。",j:"ます、ません、ました、ませんでした"},
{c:"例如「たべます」係食，「たべません」係唔食，「たべました」係食咗，「たべませんでした」係冇食。",j:"たべます、たべません、たべました、たべませんでした"},
{c:"「から」表示起點，「まで」表示終點，例如「9じから 5じまで はたらきます」。",j:"9じから 5じまで はたらきます"},
{c:"具體時間後面加「に」，例如「6じに おきます」即係6點起床。",j:"6じに おきます"},
{c:"「と」用嚟列舉全部，例如「パンと たまご」即係麵包同蛋。",j:"パンと たまご"},
{c:"「たいへんですね」係表示同情嘅「真辛苦啊」。",j:"たいへんですね"}
],

title:"第5課：いきます・きます（移動動詞）",
tutorial:[
{c:"歡迎嚟到第五課。今課我哋會學移動動詞同埋交通方式。",j:""},
{c:"「いきます」讀做 ikimasu，意思係去。例如「がっこうへ いきます」。",j:"いきます"},
{c:"「きます」讀做 kimasu，意思係嚟。例如「にほんへ きました」。",j:"きます"},
{c:"「かえります」讀做 kaerimasu，意思係返去。例如「うちへ かえります」。",j:"かえります"},
{c:"「がっこう」係學校，「えき」係車站，「スーパー」係超市。",j:"がっこう、えき、スーパー"},
{c:"交通工具方面，「でんしゃ」係電車，「ちかてつ」係地鐵，「しんかんせん」係新幹線。",j:"でんしゃ、ちかてつ、しんかんせん"},
{c:"「バス」係巴士，「タクシー」係的士，「じてんしゃ」係單車。「あるいて」係走路。",j:"バス、タクシー、じてんしゃ、あるいて"},
{c:"「ひこうき」係飛機，「ふね」係船。",j:"ひこうき、ふね"},
{c:"「ひと」係人，「ともだち」係朋友，「かぞく」係家人，「ひとりで」係一個人。",j:"ひと、ともだち、かぞく、ひとりで"},
{c:"「かれ」係他，「かのじょ」係她。",j:"かれ、かのじょ"},
{c:"時間方面，「せんしゅう」係上週，「こんしゅう」係這週，「らいしゅう」係下週。",j:"せんしゅう、こんしゅう、らいしゅう"},
{c:"「せんげつ」係上個月，「こんげつ」係這個月，「らいげつ」係下個月。",j:"せんげつ、こんげつ、らいげつ"},
{c:"「きょねん」係去年，「ことし」係今年，「らいねん」係明年。",j:"きょねん、ことし、らいねん"},
{c:"日期方面，1號係「ついたち」，2號係「ふつか」，3號係「みっか」，要特別記。",j:"ついたち、ふつか、みっか"},
{c:"10號係「とおか」，14號係「じゅうよっか」，20號係「はつか」，24號係「にじゅうよっか」。",j:"とおか、じゅうよっか、はつか、にじゅうよっか"},
{c:"「なんがつ」係幾月，「なんにち」係幾號，「いつ」係什麼時候。",j:"なんがつ、なんにち、いつ"},
{c:"「たんじょうび」係生日。",j:"たんじょうび"},
{c:"車站方面，「なんばんせん」係幾號月台，「つぎの」係下一班。",j:"なんばんせん、つぎの"},
{c:"「ふつう」係普通車，「きゅうこう」係急行，「とっきゅう」係特急。",j:"ふつう、きゅうこう、とっきゅう"},
{c:"跟住講文法。「へ」表示方向，例如「がっこうへ いきます」即係去學校。",j:"がっこうへ いきます"},
{c:"「で」表示交通工具，例如「でんしゃで いきます」即係搭電車去。",j:"でんしゃで いきます"},
{c:"「と」表示同行者，例如「かぞくと にほんへ きました」即係同家人嚟咗日本。",j:"かぞくと にほんへ きました"},
{c:"問「點去」用「なんで」，例如「なんで とうきょうへ いきますか」。",j:"なんで とうきょうへ いきますか"},
{c:"問「同邊個去」用「だれと」，例如「だれと とうきょうへ いきますか」。",j:"だれと とうきょうへ いきますか"},
{c:"問「幾時」用「いつ」，注意「いつ」後面唔加「に」。",j:"いつ"},
{c:"全面否定用「どこへも いきませんでした」，即係「邊度都冇去」。",j:"どこへも いきませんでした"},
{c:"「どういたしまして」係「不客氣」。",j:"どういたしまして"}
],

title:"第6課：たべます・のみます（日常動作）",
tutorial:[
{c:"歡迎嚟到第六課。今課我哋會學日常動作動詞同埋邀約句型。",j:""},
{c:"「たべます」讀做 tabemasu，意思係食。用於吃食物。例如「パンを たべます」。",j:"たべます"},
{c:"「のみます」讀做 nomimasu，意思係飲。用於喝飲料，也可以指吃藥。例如「おちゃを のみます」。",j:"のみます"},
{c:"「すいます」讀做 suimasu，意思係抽煙，通常講「たばこを すいます」。",j:"たばこを すいます"},
{c:"「みます」讀做 mimasu，意思係看。看電視、看電影都用得。例如「テレビを みます」。",j:"みます"},
{c:"「ききます」讀做 kikimasu，意思係聽，也可以表示「問」。例如「おんがくを ききます」。",j:"ききます"},
{c:"「よみます」讀做 yomimasu，意思係讀。例如「ほんを よみます」。",j:"よみます"},
{c:"「かきます」讀做 kakimasu，意思係寫。例如「てがみを かきます」。",j:"かきます"},
{c:"「かいます」讀做 kaimasu，意思係買。例如「かばんを かいます」。",j:"かいます"},
{c:"「とります」讀做 torimasu，意思係拍（照），通常講「しゃしんを とります」。",j:"しゃしんを とります"},
{c:"「します」讀做 shimasu，意思係做，係萬用動詞。例如「テニスを します」。",j:"します"},
{c:"「あいます」讀做 aimasu，意思係見面。要留意，見面嘅對象用助詞「に」，例如「ともだちに あいます」。",j:"ともだちに あいます"},
{c:"餐食方面，「ごはん」係飯或者一餐，「あさごはん」係早餐，「ひるごはん」係午餐，「ばんごはん」係晚餐。",j:"ごはん、あさごはん、ひるごはん、ばんごはん"},
{c:"食物方面，「パン」係麵包，「たまご」係蛋，「にく」係肉，「さかな」係魚。",j:"パン、たまご、にく、さかな"},
{c:"「やさい」係蔬菜，「くだもの」係水果，「みず」係水。",j:"やさい、くだもの、みず"},
{c:"飲品方面，「おちゃ」係茶，「こうちゃ」係紅茶，「ぎゅうにゅう」係牛奶。",j:"おちゃ、こうちゃ、ぎゅうにゅう"},
{c:"「ジュース」係果汁，「ビール」係啤酒，「おさけ」係酒。",j:"ジュース、ビール、おさけ"},
{c:"物品方面，「たばこ」係香菸，「てがみ」係信，「レポート」係報告，「しゃしん」係照片。",j:"たばこ、てがみ、レポート、しゃしん"},
{c:"「みせ」係店，「にわ」係庭院，「しゅくだい」係作業。",j:"みせ、にわ、しゅくだい"},
{c:"活動方面，「テニス」係網球，「サッカー」係足球，「おはなみ」係賞花。",j:"テニス、サッカー、おはなみ"},
{c:"副詞方面，「いっしょに」係一起，「ちょっと」係一點點，「いつも」係總是，「ときどき」係有時。",j:"いっしょに、ちょっと、いつも、ときどき"},
{c:"「それから」係然後或者還有。",j:"それから"},
{c:"常用表達方面，「ええ」係「嗯」，「いいですね」係「好啊」，「わかりました」係「我知道了」，「じゃ、また」係「再見」。",j:"ええ、いいですね、わかりました、じゃ、また"},
{c:"跟住講文法。「を」表示動作對象，例如「パンを たべます」即係食麵包。",j:"パンを たべます"},
{c:"「で」表示動作場所，例如「えきで しんぶんを かいます」即係喺車站買報紙。",j:"えきで しんぶんを かいます"},
{c:"「ませんか」用嚟邀請對方，例如「いっしょに いきませんか」即係「要唔要一齊去？」。",j:"いっしょに いきませんか"},
{c:"「ましょう」用嚟提議，例如「ちょっと やすみましょう」即係「稍微休息下啦」。",j:"ちょっと やすみましょう"},
{c:"「なにも～ません」表示全面否定，例如「なにも たべませんでした」即係「咩都冇食」。",j:"なにも たべませんでした"},
{c:"「どこで」用嚟問動作場所，例如「どこで そのかばんを かいましたか」。",j:"どこで そのかばんを かいましたか"},
{c:"「それから」用嚟連接動作，表示「然後」。",j:"それから"},
{c:"「にあいます」表示見面，對象用「に」，例如「ともだちに あいます」。",j:"ともだちに あいます"},
{c:"邀約會話嘅流程係：先邀約「～ませんか」，對方接受講「いいですね」，然後確認「どこへ」「なんじに」，再約定「～で あいましょう」，最後道別「じゃ、また」。",j:""}
],

{t:"match",q:"「いっしょに」嘅意思係？",o:["一個人","一起","分開","獨自"],a:1,e:"「いっしょに」係一起。"},
{t:"match",q:"「いつも」嘅意思係？",o:["總是","有時","從不","偶爾"],a:0,e:"「いつも」係總是。"},
{t:"match",q:"「ときどき」嘅意思係？",o:["總是","有時","從不","偶爾"],a:1,e:"「ときどき」係有時。"},
{t:"match",q:"「ちょっと」嘅意思係？",o:["很多","一點點","全部","完全"],a:1,e:"「ちょっと」係一點點。"},
{t:"match",q:"「おはなみ」嘅意思係？",o:["賞花","看電影","購物","散步"],a:0,e:"「おはなみ」漢字係「お花見」，係賞花。"},
{t:"fix",q:"邊句有錯？",o:["わたしはパンをたべます","えきでしんぶんをかいます","ともだちとあいます","けさなにもたべませんでした"],a:2,e:"「あいます」對象標準用「に」，應改為「ともだちにあいます」。"},
{t:"fix",q:"邊句有錯？",o:["わたしはほんをよみます","えきでかいます","パンをたべます","わたしはほんがよみます"],a:3,e:"「ほんがよみます」用「が」錯，應為「ほんをよみます」。"},
{t:"fix",q:"邊句有錯？",o:["いっしょにいきませんか","あしたテニスをしませんか","おさけをのみませんか","いっしょにいきましょうか"],a:3,e:"「いきましょうか」係提議（我來幫你吧？），唔係邀請對方一起。"},
{t:"fix",q:"邊句有錯？",o:["どこでそのかばんをかいましたか","えきでしんぶんをかいます","わたしはパンをたべます","わたしはえきにしんぶんをかいます"],a:3,e:"「えきに」錯，應為「えきで」（動作場所）。"},
{t:"fix",q:"邊句有錯？",o:["けさなにもたべませんでした","きのうなにもたべませんでした","あしたなにもたべませんでした","なにもたべません"],a:2,e:"「あした」係未來，唔應該用過去式「ませんでした」。"},
{t:"fix",q:"邊句有錯？",o:["ともだちにあいます","えきでともだちにあいます","10じにえきであいましょう","ともだちとあいます"],a:3,e:"「ともだちとあいます」唔標準，應為「ともだちにあいます」。"},
{t:"qa",q:"「けさなにをたべましたか」嘅正確回答係？",o:["パンをたべました","えきでかいました","ともだちにあいました","テニスをします"],a:0,e:"問食咗咩答食物。"},
{t:"qa",q:"「どこでそのかばんをかいましたか」嘅正確回答係？",o:["メキシコでかいました","パンをたべました","ともだちにあいました","テニスをします"],a:0,e:"問場所用「で」答。"},
{t:"qa",q:"「あしたなにをしますか」嘅正確回答係？",o:["テニスをします","パンをたべました","メキシコでかいました","はい、そうです"],a:0,e:"問做咩答動作。"},
{t:"qa",q:"「あしたテニスをしませんか」嘅正確回答（接受）係？",o:["ええ、いいですね","いいえ、ちがいます","すみません、ちょっと","そうですか"],a:0,e:"接受邀請用「ええ、いいですね」。"},
{t:"qa",q:"「どこでしんぶんをかいますか」嘅正確回答係？",o:["えきでかいます","パンをたべます","ともだちにあいます","テニスをします"],a:0,e:"問場所用「で」答。"},
{t:"conv",q:"A：あしたテニスをしませんか。B：＿＿＿＿。",o:["いいえ、ちがいます","ええ、いいですね","すみません、ちょっと","そうですか"],a:1,e:"接受邀請用「ええ、いいですね」。"},
{t:"conv",q:"A：どこでそのかばんをかいましたか。B：＿＿＿＿。",o:["メキシコでかいました","パンをたべました","ともだちにあいました","テニスをします"],a:0,e:"問場所用「で」答。"},
{t:"conv",q:"A：けさなにをたべましたか。B：＿＿＿＿。",o:["パンをたべました","メキシコでかいました","ともだちにあいました","テニスをします"],a:0,e:"問食咗咩答食物。"},
{t:"conv",q:"A：あしたなにをしますか。B：＿＿＿＿。",o:["テニスをします","パンをたべました","メキシコでかいました","はい、そうです"],a:0,e:"問做咩答動作。"},
{t:"conv",q:"A：いっしょにこうべへいきませんか。B：＿＿＿＿。",o:["ええ、いいですね","いいえ、ちがいます","すみません、ちょっと","そうですか"],a:0,e:"接受邀請用「ええ、いいですね」。"},
{t:"tf",q:"「を」表示動作對象。",o:["○","×"],a:0,e:"對。「を」標示動作對象。"},
{t:"tf",q:"「で」只能表示交通工具。",o:["○","×"],a:1,e:"錯。「で」仲可以表示動作場所。"},
{t:"tf",q:"「あいます」嘅對象用「と」。",o:["○","×"],a:1,e:"錯。標準用法係「に」。"},
{t:"tf",q:"「なにも＋否定」表示全面否定。",o:["○","×"],a:0,e:"對。"},
{t:"tf",q:"「それから」只能表示「然後」，唔可以表示「還有」。",o:["○","×"],a:1,e:"錯。「それから」也可以表示「還有」。"},
{t:"combo",q:"「たべます」同「のみます」嘅正確配對係？",o:["食／飲","飲／食","食／買","買／食"],a:0,e:"「たべます」食，「のみます」飲。"},
{t:"combo",q:"「おちゃ」同「みず」嘅正確配對係？",o:["水／茶","茶／水","茶／果汁","果汁／茶"],a:1,e:"「おちゃ」茶，「みず」水。"},
{t:"combo",q:"「あさごはん」同「ばんごはん」嘅正確配對係？",o:["早餐／晚餐","晚餐／早餐","午餐／晚餐","早餐／午餐"],a:0,e:"「あさごはん」早餐，「ばんごはん」晚餐。"},
{t:"apply",q:"朋友問你「あしたテニスをしませんか」，你想接受，應該點答？",o:["いいえ、ちがいます","ええ、いいですね","すみません、ちょっと","そうですか"],a:1,e:"接受邀請用「ええ、いいですね」。"},
{t:"apply",q:"你想問「你喺邊度買嗰個包包」，應該點講？",o:["どこでそのかばんをかいましたか","なにでそのかばんをかいましたか","だれとそのかばんをかいましたか","いつそのかばんをかいましたか"],a:0,e:"問場所用「どこで」。"},
{t:"apply",q:"你想講「我每天早上食麵包同蛋」，應該點講？",o:["まいあさパンとたまごをたべます","まいあさパンとたまごをのみます","まいばんパンとたまごをたべます","まいあさパンとたまごをかいます"],a:0,e:"「まいあさ」每天早上，「たべます」食。"},
{t:"apply",q:"你想邀朋友一齊去神戶，應該點講？",o:["いっしょにこうべへいきませんか","いっしょにこうべへいきます","こうべへいきませんか","こうべへいきましょう"],a:0,e:"「いっしょに＋～ませんか」係邀請。"},
{t:"apply",q:"你什麼都沒吃，應該點講？",o:["なにもたべませんでした","なにもたべました","なにもたべません","なにもたべます"],a:0,e:"「なにも＋ませんでした」表示什麼都沒吃。"}
]
}
};

/* ============ 初始化 ============ */
function initLessonBar(){
  const bar=document.getElementById('lessonBar');
  for(let i=1;i<=6;i++){
    const b=document.createElement('button');
    b.className='lesson-btn'+(i===1?' active':'');
    b.textContent='第'+i+'課';
    b.onclick=()=>{
      document.querySelectorAll('.lesson-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      currentLesson=i; stopListen(); render();
    };
    bar.appendChild(b);
  }
}
document.querySelector('.mode-bar').addEventListener('click',e=>{
  if(!e.target.classList.contains('mode-btn'))return;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  currentMode=e.target.dataset.mode;
  stopListen(); render();
});
function stopListen(){
  listenPlaying=false;
  if(listenTimer){clearTimeout(listenTimer);listenTimer=null;}
  if('speechSynthesis' in window)speechSynthesis.cancel();
}
function render(){
  const el=document.getElementById('content');
  if(!LESSONS[currentLesson]){el.innerHTML='<p>載入中…</p>';return;}
  if(currentMode==='listen')renderListen(el);
  else if(currentMode==='read')renderRead(el);
  else renderQuiz(el);
}
function renderListen(el){
  const lesson=LESSONS[currentLesson];
  if(listenIndex>=lesson.tutorial.length)listenIndex=0;
  el.innerHTML=`
    <div class="listen-box">
      <div class="section-title">🎧 第${currentLesson}課 廣東話詳細教程</div>
      <div class="audio-note"><b>💡 提示：</b>撳大掣開始播放，導師用廣東話逐句詳細講解，遇到日文自動用日文朗讀。可以閉眼專心聽，也可以點擊任何一句由嗰句開始播。可用頂部滑桿調節語速（0.5x-5x）。</div>
      <div class="tut-sentence ${listenPlaying?'active-line':''}" id="tutSentence">${fmtSentence(lesson.tutorial[listenIndex])}</div>
      <div class="progress-track"><div class="progress-fill" id="tutProgress" style="width:${(listenIndex/lesson.tutorial.length)*100}%"></div></div>
      <div class="listen-counter" id="tutCounter">第 ${listenIndex+1} / ${lesson.tutorial.length} 句</div>
      <div><button class="play-btn ${listenPlaying?'playing':''}" id="playBtn" onclick="toggleListen()">${listenPlaying?'⏸':'▶'}</button></div>
      <div class="ctrl-row">
        <button class="ctrl-btn" onclick="prevSentence()" ${listenIndex===0?'disabled':''}>← 上一句</button>
        <button class="ctrl-btn" onclick="nextSentence()" ${listenIndex>=lesson.tutorial.length-1?'disabled':''}>下一句 →</button>
        <button class="ctrl-btn" onclick="repeatSentence()">🔁 重播</button>
        <button class="ctrl-btn" onclick="jumpTo(0)">⏮ 從頭</button>
      </div>
    </div>`;
  document.getElementById('tutSentence').onclick=()=>{if(listenPlaying)stopListen();jumpTo(listenIndex);};
  if(listenPlaying)playSentence(listenIndex);
}
function fmtSentence(item){
  let h=item.c;
  if(item.j)h+=`<br><span class="jp-inline">🔊 日文：${item.j}</span>`;
  return h;
}
function toggleListen(){
  if(listenPlaying){stopListen();renderListen(document.getElementById('content'));}
  else{listenPlaying=true;renderListen(document.getElementById('content'));playSentence(listenIndex);}
}
function playSentence(idx){
  const lesson=LESSONS[currentLesson];
  if(idx>=lesson.tutorial.length){listenPlaying=false;listenIndex=0;renderListen(document.getElementById('content'));return;}
  listenIndex=idx;
  const item=lesson.tutorial[idx];
  const sEl=document.getElementById('tutSentence');
  const pEl=document.getElementById('tutProgress');
  const cEl=document.getElementById('tutCounter');
  if(sEl){sEl.innerHTML=fmtSentence(item);sEl.classList.add('active-line');pEl.style.width=((idx)/lesson.tutorial.length)*100+'%';cEl.textContent=`第 ${idx+1} / ${lesson.tutorial.length} 句`;}
  const afterCantonese=()=>{
    if(item.j)speak(item.j,'ja-JP',()=>afterAll());
    else afterAll();
  };
  const afterAll=()=>{
    if(!listenPlaying)return;
    listenTimer=setTimeout(()=>{
      if(!listenPlaying)return;
      if(idx+1<lesson.tutorial.length)playSentence(idx+1);
      else{listenPlaying=false;listenIndex=0;renderListen(document.getElementById('content'));}
    },400);
  };
  speak(item.c,'zh-HK',afterCantonese);
}
function prevSentence(){stopListen();listenIndex=Math.max(0,listenIndex-1);renderListen(document.getElementById('content'));}
function nextSentence(){stopListen();listenIndex=Math.min(LESSONS[currentLesson].tutorial.length-1,listenIndex+1);renderListen(document.getElementById('content'));}
function repeatSentence(){stopListen();listenPlaying=true;renderListen(document.getElementById('content'));playSentence(listenIndex);}
function jumpTo(idx){stopListen();listenPlaying=true;listenIndex=idx;renderListen(document.getElementById('content'));playSentence(idx);}
function renderRead(el){
  const lesson=LESSONS[currentLesson];
  el.innerHTML=`
    <div class="section-title">📖 第${currentLesson}課 生字表</div>
    <p style="color:#888;font-size:.82em;margin-bottom:8px;">點擊卡片朗讀日文發音 🔊</p>
    <div class="vocab-grid">
      ${lesson.vocab.map(v=>`
        <div class="vocab-card" onclick="speak('${esc(v.jp)}','ja-JP')">
          <button class="speak-mini" onclick="event.stopPropagation();speak('${esc(v.jp)}','ja-JP')">🔊</button>
          <div class="vocab-jp">${v.jp}</div>
          <div class="vocab-ro">${v.ro}</div>
          <div class="vocab-cn">${v.cn}</div>
        </div>`).join('')}
    </div>
    <div class="section-title" style="margin-top:18px;">📝 第${currentLesson}課 文法重點</div>
    <div class="grammar-list">
      ${lesson.grammar.map(g=>`
        <div class="grammar-item" onclick="speak('${esc(g.e.split('<br>')[0])}','ja-JP')">
          <div class="g-pattern">${g.p}</div>
          <div class="g-meaning">→ ${g.m}</div>
          <div class="g-example">${g.e}</div>
        </div>`).join('')}
    </div>`;
}
function esc(s){return s.replace(/'/g,"\\'").replace(/"/g,'&quot;');}
let quizState=null;
function renderQuiz(el){
  if(!quizState||quizState.lesson!==currentLesson)startQuiz(currentLesson);
  drawQuiz(el);
}
function startQuiz(lid){
  const raw=LESSONS[lid].quiz.slice();
  quizState={lesson:lid,questions:shuffle(raw),index:0,answered:false,correctInThisQuiz:0};
}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function drawQuiz(el){
  const q=quizState;
  if(q.index>=q.questions.length){drawResult(el);return;}
  const item=q.questions[q.index];
  const typeLabel={mc:'選擇題',fill:'填空題',trans:'翻譯題',reorder:'重組題',match:'配對題',fix:'改錯題',qa:'問答題',conv:'會話題',tf:'是非題',combo:'連連看',apply:'應用題'}[item.t]||'題目';
  el.innerHTML=`
    <div class="quiz-wrap">
      <div class="quiz-prog"><span>第 ${q.index+1} / ${q.questions.length} 題</span><div class="qbar"><div class="qbar-fill" style="width:${(q.index/q.questions.length)*100}%"></div></div><span>✅ ${q.correctInThisQuiz}</span></div>
      <div class="qcard"><div class="qtag">${typeLabel}</div><div class="qtext">${item.q}</div></div>
      <div class="options" id="options">${item.o.map((opt,i)=>`<button class="opt" data-i="${i}" onclick="checkAnswer(${i})">${opt}</button>`).join('')}</div>
      <div id="feedback"></div>
    </div>`;
}
function checkAnswer(chosen){
  if(quizState.answered)return;
  quizState.answered=true;
  const q=quizState,item=q.questions[q.index];
  const isCorrect=chosen===item.a;
  document.querySelectorAll('#options .opt').forEach((b,i)=>{b.disabled=true;if(i===item.a)b.classList.add('correct');else if(i===chosen)b.classList.add('wrong');});
  const fb=document.getElementById('feedback');
  if(isCorrect){
    q.correctInThisQuiz++;correctCount++;streak++;
    const gain=10+Math.min(streak*2,20);totalScore+=gain;beep('correct');
    fb.innerHTML=`<div class="fb correct"><div class="fb-title">✅ 答對了！ +${gain} 分（連對 ${streak}）</div><div class="fb-exp"><b>詳細解釋：</b>${item.e}</div></div>`;
  }else{
    streak=0;beep('wrong');
    fb.innerHTML=`<div class="fb wrong"><div class="fb-title">❌ 答錯了</div><div class="fb-exp"><b>正確答案：</b>${item.o[item.a]}</div><div class="fb-exp" style="margin-top:4px;"><b>詳細解釋：</b>${item.e}</div></div>`;
  }
  updateScoreBar();
  if(item.o[item.a]&&/[\u3040-\u30ff\u4e00-\u9faf]/.test(item.o[item.a]))setTimeout(()=>speak(item.o[item.a],'ja-JP'),250);
  const nb=document.createElement('button');nb.className='next-btn';
  nb.textContent=q.index<q.questions.length-1?'下一題 →':'查看結果 →';
  nb.onclick=()=>{q.index++;q.answered=false;drawQuiz(document.getElementById('content'));document.getElementById('content').scrollIntoView({behavior:'smooth',block:'start'});};
  fb.appendChild(nb);
}
function drawResult(el){
  const q=quizState,total=q.questions.length,c=q.correctInThisQuiz,pct=c/total;
  let emoji,msg;
  if(pct===1){emoji='🏆';msg='太厲害啦！全對！你係日文天才！';}
  else if(pct>=0.8){emoji='🎉';msg='好叻呀！繼續保持！';}
  else if(pct>=0.6){emoji='💪';msg='唔錯喔！再複習一下會更好！';}
  else{emoji='📚';msg='唔好灰心，睇多幾次教程再嚟挑戰！';}
  el.innerHTML=`<div class="result-screen"><div class="result-emoji">${emoji}</div><div class="result-score">${c} / ${total}</div><div class="result-msg">${msg}</div><button class="restart-btn" onclick="startQuiz(${currentLesson});drawQuiz(document.getElementById('content'))">🔄 再挑戰一次</button></div>`;
}
initLessonBar();
updateScoreBar();
render();
</script>
