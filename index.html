<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日文溫書網頁（第1〜8課）</title>
<style>
:root{
  --bg:#f4f7fb; --card:#ffffff; --accent:#3b6ea5; --accent-l:#e8f0fa;
  --ok:#2e7d32; --ng:#c62828; --text:#22303f; --muted:#6b7c93;
  --border:#dbe4ee; --warn:#b26a00;
}
*{box-sizing:border-box;}
body{
  margin:0; padding:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  line-height:1.75; font-size:16px;
}
header{
  background:linear-gradient(135deg,#3b6ea5,#5a8fc7); color:#fff;
  padding:18px 16px; box-shadow:0 2px 8px rgba(0,0,0,.12);
}
header h1{margin:0; font-size:20px; letter-spacing:1px;}
header p{margin:4px 0 0; font-size:13px; opacity:.9;}

/* ===== 控制面板 ===== */
.control-panel{
  position:sticky; top:0; z-index:50;
  background:#fff; border-bottom:2px solid var(--border);
  padding:10px 12px; box-shadow:0 2px 10px rgba(0,0,0,.06);
}
.ctrl-row{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px;}
.ctrl-row:last-child{margin-bottom:0;}
.ctrl-row label{font-size:13px; font-weight:600; color:var(--muted);}
input[type=range]{flex:1; min-width:120px; accent-color:var(--accent);}
button{
  font-family:inherit; font-size:14px; cursor:pointer;
  border:1px solid var(--border); background:#fff; color:var(--text);
  border-radius:8px; padding:6px 12px; transition:.15s;
}
button:hover{background:var(--accent-l); border-color:var(--accent);}
button:active{transform:scale(.97);}
button.primary{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;}
button.primary:hover{background:#2f5b88;}
button.danger{background:#fff0f0; color:var(--ng); border-color:#f3c4c4;}
button.danger:hover{background:#ffe0e0;}
#rateVal{font-weight:700; color:var(--accent); min-width:44px; display:inline-block; text-align:center;}
.mode-switch{display:flex; gap:6px;}
.mode-switch button.active{background:var(--accent); color:#fff; border-color:var(--accent);}
#statusMsg{font-size:13px; color:var(--accent); font-weight:600; min-height:20px;}
.warn-box{background:#fff8e6; border:1px solid #ffd98a; color:var(--warn);
  padding:8px 12px; border-radius:8px; font-size:13px; margin:8px 12px; display:none;}
.warn-box.show{display:block;}

/* ===== 主體 ===== */
main{max-width:900px; margin:0 auto; padding:16px 12px 80px;}

/* 課堂區塊 */
.lesson-block{
  background:var(--card); border:1px solid var(--border);
  border-radius:14px; padding:16px; margin-bottom:28px;
  box-shadow:0 2px 10px rgba(0,0,0,.04);
}
.lesson-title{
  font-size:20px; font-weight:800; color:var(--accent);
  border-left:6px solid var(--accent); padding-left:12px;
  margin:0 0 4px;
}
.lesson-sub{font-size:13px; color:var(--muted); margin:0 0 16px; padding-left:18px;}
.section-title{
  font-size:16px; font-weight:700; margin:22px 0 10px;
  padding:6px 10px; background:var(--accent-l); border-radius:8px;
  color:#2a5683;
}

/* 單字 */
.vocab-grid{display:grid; grid-template-columns:1fr; gap:6px;}
.vocab-item{
  display:flex; flex-wrap:wrap; align-items:center; gap:8px;
  padding:8px 10px; border:1px solid var(--border); border-radius:8px;
  background:#fbfdff;
}
.v-jp{font-weight:600; font-size:15px;}
.v-zh{color:var(--muted); font-size:14px;}
.v-zh::before{content:"→ "; }

/* 例句 / 句子 */
.sent{
  padding:10px 12px; margin:8px 0; border-left:4px solid #cddff0;
  background:#fafcff; border-radius:0 8px 8px 0;
}
.sent .jp-line{font-size:16px; font-weight:600; display:flex; align-items:flex-start; gap:8px; flex-wrap:wrap;}
.sent .ro-line{font-size:13px; color:var(--muted); font-style:italic; margin-top:2px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.sent .zh-line{font-size:14px; color:#33506b; margin-top:4px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;}

/* 朗讀小按鈕 */
.spk{
  border:1px solid #cfe0f0; background:#f0f7ff; color:var(--accent);
  border-radius:6px; padding:2px 7px; font-size:13px; line-height:1.4;
  flex-shrink:0;
}
.spk:hover{background:var(--accent); color:#fff;}

/* MC */
.mc-card{
  border:1px solid var(--border); border-radius:12px;
  padding:14px; margin-bottom:16px; background:#fff;
}
.mc-q{font-size:16px; font-weight:700; margin-bottom:10px; display:flex; gap:8px; align-items:flex-start; flex-wrap:wrap;}
.mc-q .num{color:var(--accent); flex-shrink:0;}
.options{display:flex; flex-direction:column; gap:8px;}
.opt{
  text-align:left; padding:10px 12px; border-radius:10px; border:1.5px solid var(--border);
  background:#fbfdff; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  font-size:15px; transition:.15s;
}
.opt:hover:not(.locked){border-color:var(--accent); background:var(--accent-l);}
.opt.locked{cursor:default;}
.opt.correct{border-color:var(--ok); background:#eaf7ea;}
.opt.wrong{border-color:var(--ng); background:#fdeaea;}
.opt .mark{font-weight:800; font-size:15px; flex-shrink:0;}
.opt.correct .mark{color:var(--ok);}
.opt.wrong .mark{color:var(--ng);}
.opt .otext{flex:1; font-weight:600;}

/* 答案區 */
.answer{
  margin-top:12px; padding:12px; border-radius:10px;
  background:#f4faf4; border:1px solid #c9e6c9;
  font-size:14px;
}
.answer.hidden{display:none;}
.answer .ans-head{font-weight:800; color:var(--ok); margin-bottom:6px;}
.answer ul{margin:6px 0 0; padding-left:20px;}
.answer li{margin-bottom:4px;}
.answer li.ok{color:var(--ok);}
.answer li.no{color:var(--ng);}
.answer .exp-zh{color:#2c4a2c; margin-top:8px; padding-top:8px; border-top:1px dashed #c9e6c9;}

/* 填空／翻譯 */
.fill-card{border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:16px; background:#fff;}
.fill-q{font-weight:700; margin-bottom:8px;}
.fill-input{
  width:100%; max-width:420px; padding:9px 12px; font-size:15px;
  border:1.5px solid var(--border); border-radius:8px; font-family:inherit;
  margin:6px 0;
}
.fill-input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(59,110,165,.12);}
.fill-btns{display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;}

/* 配對題 */
.match-card{border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:16px; background:#fff;}
.match-cols{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.match-col{display:flex; flex-direction:column; gap:6px;}
.match-item{
  padding:8px 10px; border:1.5px solid var(--border); border-radius:8px;
  background:#fbfdff; cursor:pointer; font-size:14px; transition:.15s;
}
.match-item.sel{border-color:var(--accent); background:var(--accent-l);}
.match-item.done{border-color:var(--ok); background:#eaf7ea; cursor:default; opacity:.75;}
.match-item.done.wrongp{border-color:var(--ng); background:#fdeaea;}

/* 故事 */
.story-block{
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:16px; margin-bottom:28px; box-shadow:0 2px 10px rgba(0,0,0,.04);
}
.story-sent{padding:9px 0; border-bottom:1px dashed #e6eef6;}
.story-sent:last-child{border-bottom:none;}
.story-sent .jp-line{font-size:16px; font-weight:600;}
.story-sent .ro-line{font-size:13px; color:var(--muted); font-style:italic;}
.story-sent .zh-line{font-size:14px; color:#33506b;}
.story-sent .zh-line.hidden{display:none;}
.trans-btn{margin:10px 0;}

/* 雜項 */
.roman{font-style:italic; color:var(--muted); font-size:13px;}
.note{font-size:13px; color:var(--muted); background:#f6f9fc; padding:8px 12px; border-radius:8px;}
hr.sep{border:none; border-top:1px dashed var(--border); margin:18px 0;}

@media (max-width:600px){
  .match-cols{grid-template-columns:1fr;}
  .lesson-title{font-size:18px;}
  header h1{font-size:17px;}
  .ctrl-row{gap:6px;}
  button{padding:6px 10px; font-size:13px;}
}
</style>
</head>
<body>

<header>
  <h1>📚 日文溫書網頁 — 第1〜8課</h1>
  <p>單字・文法・MC・漢字解釋・其他練習・長篇故事（可續寫）</p>
</header>

<div class="warn-box" id="warnBox"></div>

<!-- ===== 控制面板 ===== -->
<div class="control-panel">
  <div class="ctrl-row">
    <label for="rate">語速</label>
    <input type="range" id="rate" min="0.5" max="5" step="0.1" value="1">
    <span id="rateVal">1.0×</span>
  </div>
  <div class="ctrl-row">
    <label>自動朗讀：</label>
    <button class="primary" id="btnStart">▶ 開始自動朗讀</button>
    <button id="btnPause">⏸ 暫停</button>
    <button id="btnResume">⏵ 繼續</button>
    <button class="danger" id="btnStop">⏹ 停止</button>
  </div>
  <div class="ctrl-row">
    <label>模式：</label>
    <div class="mode-switch">
      <button id="modeJP" class="active">只讀日文</button>
      <button id="modeAll">讀日文＋中文解說＋答案</button>
    </div>
  </div>
  <div class="ctrl-row">
    <span id="statusMsg">就緒</span>
  </div>
</div>

<main id="app"></main>

<script>
/* =======================================================================
   核心：語音引擎
   ======================================================================= */
const Speech = {
  rate: 1,
  voices: { ja: null, zh: null },
  supported: !!window.speechSynthesis,
  init() {
    if (!this.supported) {
      document.getElementById('warnBox').textContent =
        '⚠️ 你的瀏覽器不支援 Web Speech API，朗讀功能無法使用。建議使用 Chrome / Edge / Safari。';
      document.getElementById('warnBox').classList.add('show');
      return;
    }
    const load = () => {
      const vs = speechSynthesis.getVoices();
      this.voices.ja = vs.find(v => v.lang === 'ja-JP') || vs.find(v => v.lang.toLowerCase().startsWith('ja')) || null;
      this.voices.zh = vs.find(v => v.lang === 'zh-TW') || vs.find(v => v.lang.toLowerCase().startsWith('zh')) || null;
      if (!this.voices.ja) {
        document.getElementById('warnBox').textContent =
          '⚠️ 找不到日文語音（ja-JP）。請在系統／瀏覽器安裝日文語音包，否則日文朗讀可能無聲。';
        document.getElementById('warnBox').classList.add('show');
      }
    };
    load();
    speechSynthesis.onvoiceschanged = load;
    // 某些瀏覽器載入較慢，再補一次
    setTimeout(load, 800);
    setTimeout(load, 2000);
  },
  makeUtterance(text, lang) {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    if (lang === 'ja-JP' && this.voices.ja) u.voice = this.voices.ja;
    if (lang === 'zh-TW' && this.voices.zh) u.voice = this.voices.zh;
    u.rate = this.rate;
    u.pitch = 1;
    u.volume = 1;
    return u;
  },
  speak(text, lang, onEnd) {
    if (!this.supported || !text) { if (onEnd) onEnd(); return; }
    const u = this.makeUtterance(text, lang);
    if (onEnd) { u.onend = onEnd; u.onerror = onEnd; }
    speechSynthesis.speak(u);
  }
};

/* 單句朗讀（會先停掉其他朗讀，避免重疊） */
function speakText(text, lang) {
  if (!Speech.supported) { alert('你的瀏覽器不支援語音朗讀。'); return; }
  speechSynthesis.cancel();
  Speech.speak(text, lang || 'ja-JP');
}
function speakJP(text) { speakText(text, 'ja-JP'); }
function speakZH(text) { speakText(text, 'zh-TW'); }

/* =======================================================================
   羅馬音 → 假名 轉換（確保羅馬音按鈕讀出正確日文讀音）
   ======================================================================= */
const ROMA_MAP = {
  kya:'きゃ',kyu:'きゅ',kyo:'きょ',sha:'しゃ',shu:'しゅ',sho:'しょ',
  cha:'ちゃ',chu:'ちゅ',cho:'ちょ',nya:'にゃ',nyu:'にゅ',nyo:'にょ',
  hya:'ひゃ',hyu:'ひゅ',hyo:'ひょ',mya:'みゃ',myu:'みゅ',myo:'みょ',
  rya:'りゃ',ryu:'りゅ',ryo:'りょ',gya:'ぎゃ',gyu:'ぎゅ',gyo:'ぎょ',
  ja:'じゃ',ju:'じゅ',jo:'じょ',bya:'びゃ',byu:'びゅ',byo:'びょ',
  pya:'ぴゃ',pyu:'ぴゅ',pyo:'ぴょ',
  a:'あ',i:'い',u:'う',e:'え',o:'お',
  ka:'か',ki:'き',ku:'く',ke:'け',ko:'こ',
  sa:'さ',shi:'し',su:'す',se:'せ',so:'そ',
  ta:'た',chi:'ち',tsu:'つ',te:'て',to:'と',
  na:'な',ni:'に',nu:'ぬ',ne:'ね',no:'の',
  ha:'は',hi:'ひ',fu:'ふ',he:'へ',ho:'ほ',
  ma:'ま',mi:'み',mu:'む',me:'め',mo:'も',
  ya:'や',yu:'ゆ',yo:'よ',
  ra:'ら',ri:'り',ru:'る',re:'れ',ro:'ろ',
  wa:'わ',wo:'を',nn:'ん',n:'ん',
  ga:'が',gi:'ぎ',gu:'ぐ',ge:'げ',go:'ご',
  za:'ざ',ji:'じ',zu:'ず',ze:'ぜ',zo:'ぞ',
  da:'だ',di:'ぢ',du:'づ',de:'で',do:'ど',
  ba:'ば',bi:'び',bu:'ぶ',be:'べ',bo:'ぼ',
  pa:'ぱ',pi:'ぴ',pu:'ぷ',pe:'ぺ',po:'ぽ'
};
function romajiToKana(input) {
  const s = String(input).toLowerCase().replace(/[^a-z]/g, '');
  let out = '', i = 0;
  while (i < s.length) {
    // 促音（雙輔音）
    if (i + 1 < s.length && s[i] === s[i + 1] && !'aeiou'.includes(s[i]) && s[i] !== 'n') {
      out += 'っ'; i++; continue;
    }
    let matched = false;
    for (let len = 3; len >= 1; len--) {
      const sub = s.substr(i, len);
      if (ROMA_MAP[sub]) {
        // 「n」後接母音或 y 時不吞掉
        if (sub === 'n' && i + 1 < s.length && 'aiueoy'.includes(s[i + 1])) { /* fallthrough */ }
        out += ROMA_MAP[sub]; i += len; matched = true; break;
      }
    }
    if (!matched) i++;
  }
  return out;
}

/* =======================================================================
   工具
   ======================================================================= */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function spkBtn(text, lang) {
  return `<button class="spk" data-speak-btn="${esc(text)}" data-lang="${lang}">🔊</button>`;
}

/* =======================================================================
   ★★★ 課程資料（每一課 = 一個獨立物件，方便日後擴充）★★★
   單字格式： [顯示日文, 假名, 羅馬音, 中文]
   動詞格式： [顯示日文, 假名, 羅馬音, 中文, 辭書形顯示, 辭書形假名, 辭書形羅馬音]
   ======================================================================= */
const LESSONS = [];

/* =======================================================================
   ======================  第1課區塊開始  ======================
   ======================================================================= */
LESSONS.push({
  num: 1,
  title: '第1課',
  sub: '自己紹介・職業・国籍・年齢',
  vocab: [
    ['わたし','わたし','watashi','我'],
    ['あなた','あなた','anata','你'],
    ['あの人','あのひと','anohito','那個人'],
    ['あの方','あのかた','anokata','那位（尊稱）'],
    ['〜さん','さん','san','～先生／小姐'],
    ['〜ちゃん','ちゃん','chan','～（親暱稱呼）'],
    ['〜人','じん','jin','～人（國籍）'],
    ['先生','せんせい','sensei','老師'],
    ['教師','きょうし','kyoushi','教師'],
    ['学生','がくせい','gakusei','學生'],
    ['会社員','かいしゃいん','kaishain','公司職員'],
    ['社員','しゃいん','shain','（某公司的）職員'],
    ['銀行員','ぎんこういん','ginkouin','銀行職員'],
    ['医者','いしゃ','isha','醫生'],
    ['研究者','けんきゅうしゃ','kenkyuusha','研究者'],
    ['大学','だいがく','daigaku','大學'],
    ['病院','びょういん','byouin','醫院'],
    ['だれ','だれ','dare','誰'],
    ['どなた','どなた','donata','哪位（尊稱）'],
    ['〜歳','さい','sai','～歲'],
    ['何歳','なんさい','nansai','幾歲'],
    ['おいくつ','おいくつ','oikutsu','幾歲（禮貌）'],
    ['はい','はい','hai','是'],
    ['いいえ','いいえ','iie','不是'],
    ['はじめまして','はじめまして','hajimemashite','初次見面'],
    ['〜から','から','kara','從～'],
    ['来ました','きました','kimashita','來了','来る','くる','kuru'],
    ['どうぞ','どうぞ','douzo','請'],
    ['よろしくお願いします','よろしくおねがいします','yoroshiku onegaishimasu','請多指教'],
    ['失礼ですが','しつれいですが','shitsurei desu ga','請問一下'],
    ['お名前は','おなまえは','onamae wa','您叫什麼名字'],
    ['こちらは〜さんです','こちらは〜さんです','kochira wa ~ san desu','這位是～先生／小姐'],
    ['アメリカ','アメリカ','amerika','美國'],
    ['イギリス','イギリス','igirisu','英國'],
    ['インド','インド','indo','印度'],
    ['インドネシア','インドネシア','indoneshia','印尼'],
    ['韓国','かんこく','kankoku','韓國'],
    ['タイ','タイ','tai','泰國'],
    ['中国','ちゅうごく','chuugoku','中國'],
    ['ドイツ','ドイツ','doitsu','德國'],
    ['日本','にほん','nihon','日本'],
    ['ブラジル','ブラジル','burajiru','巴西'],
    ['IMC','アイエムシー','aiemushii','IMC公司'],
    ['パワー電気','パワーでんき','pawaa denki','Power電氣'],
    ['ブラジルエアー','ブラジルエアー','burajiru eaa','巴西航空'],
    ['AKC','エーケーシー','eekeshii','AKC公司'],
    ['神戸病院','こうべびょういん','koube byouin','神戶醫院'],
    ['桜大学','さくらだいがく','sakura daigaku','櫻花大學'],
    ['富士大学','ふじだいがく','fuji daigaku','富士大學'],
    ['じゃありません','じゃありません','ja arimasen','不是（口語）'],
    ['ではないです','ではないです','dewa nai desu','不是（書面）'],
    ['おはようございます','おはようございます','ohayou gozaimasu','早安']
  ],
  grammar: [
    { t:'名詞文：A は B です', d:'「は」是主題助詞，讀作 wa。表示「A 是 B」。' },
    { t:'否定：A は B じゃありません／ではないです', d:'「じゃありません」較口語；「ではないです」較書面。' },
    { t:'疑問：A は B ですか', d:'句尾加「か」形成疑問句，語調上揚。回答用「はい」或「いいえ」。' },
    { t:'も（也）', d:'把「は」換成「も」，表示「也是」。' },
    { t:'の（的）', d:'名詞＋の＋名詞，表示所屬或修飾。' }
  ],
  examples: [
    ['わたしは学生（がくせい）です。','わたしはがくせいです。','watashi wa gakusei desu.','我是學生。'],
    ['わたしは会社員（かいしゃいん）じゃありません。','わたしはかいしゃいんじゃありません。','watashi wa kaishain ja arimasen.','我不是公司職員。'],
    ['あなたは先生（せんせい）ですか。','あなたはせんせいですか。','anata wa sensei desu ka.','你是老師嗎？'],
    ['あの人はだれですか。','あのひとはだれですか。','anohito wa dare desu ka.','那個人是誰？'],
    ['こちらはミラーさんです。','こちらはミラーさんです。','kochira wa miraa san desu.','這位是米勒先生。'],
    ['わたしも学生です。','わたしもがくせいです。','watashi mo gakusei desu.','我也是學生。'],
    ['これはわたしの本です。','これはわたしのほんです。','kore wa watashi no hon desu.','這是我的書。'],
    ['はじめまして。どうぞよろしくお願いします。','はじめまして。どうぞよろしくおねがいします。','hajimemashite. douzo yoroshiku onegaishimasu.','初次見面，請多指教。']
  ],
  mc: [

/* =======================================================================
   渲染：單字
   ======================================================================= */
function renderVocab(vocab) {
  let html = '<div class="vocab-grid">';
  vocab.forEach(v => {
    const [jp, kana, ro, zh, dj, dk, dr] = v;
    const dict = dj ? ` ／ 辞書形：${dj}（${dk}／${dr}）` : '';
    const full = `${jp}（${kana}／${ro}）${dict}`;
    html += `<div class="vocab-item">
      <span class="v-jp" data-speak="${esc(kana)}" data-speak-lang="ja-JP">${esc(full)}</span>
      ${spkBtn(kana, 'ja-JP')}
      <span class="v-zh" data-speak="${esc(zh)}" data-speak-lang="zh-TW">${esc(zh)}</span>
    </div>`;
  });
  html += '</div>';
  return html;
}

/* 渲染：句子（日文＋羅馬音＋中文） */
function renderSentence(jp, kana, ro, zh, extraClass) {
  return `<div class="sent ${extraClass || ''}">
    <div class="jp-line">
      <span data-speak="${esc(kana)}" data-speak-lang="ja-JP">${esc(jp)}</span>
      ${spkBtn(kana, 'ja-JP')}
    </div>
    <div class="ro-line">
      <span>${esc(ro)}</span>
      ${spkBtn(kana, 'ja-JP')}
    </div>
    <div class="zh-line">
      <span data-speak="${esc(zh)}" data-speak-lang="zh-TW">${esc(zh)}</span>
      ${spkBtn(zh, 'zh-TW')}
    </div>
  </div>`;
}

/* 渲染：MC 題 */
function renderMC(mc, lessonIdx, qIdx) {
  const uid = `mc-${lessonIdx}-${qIdx}`;
  let optsHTML = '';
  mc.opts.forEach((o, i) => {
    const [t, k, r, ok, e] = o;
    optsHTML += `<button class="opt" data-uid="${uid}" data-idx="${i}" data-ok="${ok}">
      <span class="mark"></span>
      <span class="otext" data-speak="${esc(k)}" data-speak-lang="ja-JP">${esc(t)}</span>
      <span class="spk" data-speak-btn="${esc(k)}" data-lang="ja-JP">🔊</span>
    </button>`;
  });

  let ansHTML = '';
  mc.opts.forEach(o => {
    const [t, k, r, ok, e] = o;
    ansHTML += `<li class="${ok ? 'ok' : 'no'}">
      <b>${ok ? '✓' : '✗'} ${esc(t)}</b>（${esc(k)}／${esc(r)}）：
      <span data-speak="${esc(e)}" data-speak-lang="zh-TW">${esc(e)}</span>
      ${spkBtn(e, 'zh-TW')}
    </li>`;
  });

  return `<div class="mc-card">
    <div class="mc-q">
      <span class="num">Q${qIdx + 1}</span>
      <span data-speak="${esc(mc.qk)}" data-speak-lang="ja-JP">${esc(mc.q)}</span>
      ${spkBtn(mc.qk, 'ja-JP')}
    </div>
    <div class="ro-line" style="margin-bottom:8px;">${esc(mc.qr)} ${spkBtn(mc.qk, 'ja-JP')}</div>
    <div class="options">${optsHTML}</div>
    <div class="answer hidden" id="ans-${uid}">
      <div class="ans-head">答案與解釋</div>
      <ul>${ansHTML}</ul>
      <div class="exp-zh" data-speak="${esc(mc.exp)}" data-speak-lang="zh-TW">💡 ${esc(mc.exp)} ${spkBtn(mc.exp, 'zh-TW')}</div>
    </div>
  </div>`;
}

    <div class="answer hidden" id="ans-${uid}">
      <div class="ans-head">答案與解釋</div>
      <div>✅ 參考答案：<b>${esc(q.ans)}</b> ${spkBtn(q.ans, 'ja-JP')}</div>
      <div class="exp-zh" data-speak="${esc(q.exp)}" data-speak-lang="zh-TW">💡 ${esc(q.exp)} ${spkBtn(q.exp, 'zh-TW')}</div>
    </div>
  </div>`;
}

/* 渲染：其他練習 */
function renderOther(q, lessonIdx, qIdx) {
  const uid = `ot-${lessonIdx}-${qIdx}`;
  const typeLabel = {
    'fill': '填空題',
    'trans-jp': '日譯中',
    'trans-zh': '中譯日',
    'match': '配對題'
  }[q.type] || '練習';

  return `<div class="fill-card">
    <div class="fill-q">
      <span class="num" style="color:var(--accent);">【${typeLabel}】</span>
      <span data-speak="${esc(q.qk)}" data-speak-lang="ja-JP">${esc(q.q)}</span>
      ${spkBtn(q.qk, 'ja-JP')}
    </div>
    <div class="roman">${esc(q.qr)}</div>
    <input class="fill-input" type="text" data-uid="${uid}" placeholder="請輸入答案">
    <div class="fill-btns">
      <button class="primary" data-check="${uid}">檢查答案</button>
      <button data-reveal="${uid}">顯示答案</button>
    </div>
    <div class="answer hidden" id="ans-${uid}">
      <div class="ans-head">答案與解釋</div>
      <div>✅ 參考答案：<b data-speak="${esc(q.ans)}" data-speak-lang="ja-JP">${esc(q.ans)}</b> ${spkBtn(q.ans, 'ja-JP')}</div>
      <div class="exp-zh" data-speak="${esc(q.exp)}" data-speak-lang="zh-TW">💡 ${esc(q.exp)} ${spkBtn(q.exp, 'zh-TW')}</div>
    </div>
  </div>`;
}

/* 渲染：整課 */
function renderLesson(L, idx) {
  let html = `<section class="lesson-block" id="lesson-${L.num}">
    <h2 class="lesson-title">${esc(L.title)}</h2>
    <p class="lesson-sub">${esc(L.sub)}</p>

    <div class="section-title">📖 教學重點（單字表）</div>
    ${renderVocab(L.vocab)}

    <div class="section-title">📝 文法說明</div>
    <div class="note">
      ${L.grammar.map(g => `<div style="margin-bottom:8px;">
        <b>${esc(g.t)}</b><br>
        <span data-speak="${esc(g.d)}" data-speak-lang="zh-TW">${esc(g.d)}</span>
        ${spkBtn(g.d, 'zh-TW')}
      </div>`).join('')}
    </div>

    <div class="section-title">💬 例句</div>
    ${L.examples.map(e => renderSentence(e[0], e[1], e[2], e[3])).join('')}

    <div class="section-title">✅ MC 選擇題（${L.mc.length} 題）</div>
    ${L.mc.map((m, i) => renderMC(m, idx, i)).join('')}

    <div class="section-title">🈶 漢字解釋題（${L.kanji.length} 題）</div>
    ${L.kanji.map((k, i) => renderKanji(k, idx, i)).join('')}

    <div class="section-title">✏️ 其他練習（${L.other.length} 題）</div>
    ${L.other.map((o, i) => renderOther(o, idx, i)).join('')}
  </section>`;
  return html;
}

/* 渲染：故事 */
function renderStory() {
  let html = `<section class="story-block" id="story">
    <h2 class="lesson-title">📚 ${esc(STORY.title)}</h2>
    <p class="lesson-sub">${esc(STORY.titleKana)}／${esc(STORY.titleRo)}</p>
    <button class="primary trans-btn" id="toggleStoryZh">顯示／隱藏中文翻譯</button>
    ${STORY.sentences.map(s => `
      <div class="story-sent">
        <div class="jp-line">
          <span data-speak="${esc(s[1])}" data-speak-lang="ja-JP">${esc(s[0])}</span>
          ${spkBtn(s[1], 'ja-JP')}
        </div>
        <div class="ro-line">${esc(s[2])} ${spkBtn(s[1], 'ja-JP')}</div>
        <div class="zh-line hidden" data-speak="${esc(s[3])}" data-speak-lang="zh-TW">${esc(s[3])} ${spkBtn(s[3], 'zh-TW')}</div>
      </div>
    `).join('')}
  </section>`;
  return html;
}

/* 將所有內容渲染到頁面 */
function renderAll() {
  const app = document.getElementById('app');
  let html = '';
  LESSONS.forEach((L, i) => { html += renderLesson(L, i); });
  html += renderStory();
  app.innerHTML = html;
}

/* =======================================================================
   互動：事件委派
   ======================================================================= */
document.addEventListener('click', e => {
  // 1) 朗讀按鈕
  const spk = e.target.closest('[data-speak-btn]');
  if (spk) {
    e.stopPropagation();
    e.preventDefault();
    const text = spk.dataset.speakBtn;
    const lang = spk.dataset.lang || 'ja-JP';
    if (lang === 'ja-JP') speakJP(text); else speakZH(text);
    return;
  }

  // 2) MC 選項
  const opt = e.target.closest('.opt');
  if (opt && !opt.classList.contains('locked')) {
    const uid = opt.dataset.uid;
    const card = opt.closest('.mc-card');
    const allOpts = card.querySelectorAll('.opt');
    allOpts.forEach(o => {
      o.classList.add('locked');
      const ok = o.dataset.ok === '1';
      const mark = o.querySelector('.mark');
      if (ok) { o.classList.add('correct'); mark.textContent = '✓'; }
      else if (o === opt) { o.classList.add('wrong'); mark.textContent = '✗'; }
      else { mark.textContent = ''; }
    });
    const ans = document.getElementById('ans-' + uid);
    if (ans) ans.classList.remove('hidden');
    return;
  }

  // 3) 顯示答案
  const reveal = e.target.closest('[data-reveal]');
  if (reveal) {
    const uid = reveal.dataset.reveal;
    const ans = document.getElementById('ans-' + uid);
    if (ans) ans.classList.remove('hidden');
    return;
  }

  // 4) 檢查答案（填空／翻譯）
  const check = e.target.closest('[data-check]');
  if (check) {
    const uid = check.dataset.check;
    const card = check.closest('.fill-card');
    const input = card.querySelector('.fill-input');
    const ans = document.getElementById('ans-' + uid);
    if (ans) ans.classList.remove('hidden');
    if (input) {
      const v = input.value.trim();
      // 簡單比對：去掉空白與標點後比較
      const norm = s => String(s).replace(/[\s。、，．,.]/g, '');
      const okBox = ans.querySelector('.ans-head');
      if (norm(v) === norm(ans.querySelector('b').textContent)) {
        okBox.textContent = '✅ 正確！答案與解釋';
        okBox.style.color = 'var(--ok)';
      } else if (v === '') {
        okBox.textContent = '答案與解釋';
      } else {
        okBox.textContent = '❌ 再試一次！以下為參考答案';
        okBox.style.color = 'var(--ng)';
      }
    }
    return;
  }

  // 5) 故事中文翻譯開關
  if (e.target.id === 'toggleStoryZh') {
    document.querySelectorAll('.story-sent .zh-line').forEach(el => {
      el.classList.toggle('hidden');
    });
  }
});

/* =======================================================================
   語速控制
   ======================================================================= */
const rateInput = document.getElementById('rate');
const rateVal = document.getElementById('rateVal');
rateInput.addEventListener('input', () => {
  Speech.rate = parseFloat(rateInput.value);
  rateVal.textContent = Speech.rate.toFixed(1) + '×';
});

/* =======================================================================
   自動連續朗讀
   ======================================================================= */
const Auto = {
  queue: [],
  idx: 0,
  playing: false,
  paused: false,
  mode: 'jp',          // 'jp' 或 'all'
  statusEl: document.getElementById('statusMsg'),
  setStatus(t) { this.statusEl.textContent = t; },

  buildQueue() {
    const nodes = document.querySelectorAll('[data-speak]');
    const list = [];
    nodes.forEach(n => {
      const text = n.dataset.speak;
      const lang = n.dataset.speakLang || 'ja-JP';
      if (!text) return;
      // 只讀日文模式：跳過中文
      if (this.mode === 'jp' && lang !== 'ja-JP') return;
      // 答案區：在「讀日文＋中文」模式下，若隱藏則先自動顯示
      const ansBox = n.closest('.answer');
      if (ansBox && ansBox.classList.contains('hidden')) {
        if (this.mode === 'all') {
          ansBox.classList.remove('hidden');
        } else {
          return; // 只讀日文模式下不讀隱藏答案
        }
      }
      // 避免同一個元素重複（例如同時有 data-speak 的按鈕）
      list.push({ text, lang });
    });
    // 去除相鄰重複
    const out = [];
    for (let i = 0; i < list.length; i++) {
      if (i > 0 && out[out.length - 1].text === list[i].text
          && out[out.length - 1].lang === list[i].lang) continue;
      out.push(list[i]);
    }
    return out;
  },

  start() {
    if (!Speech.supported) { alert('你的瀏覽器不支援語音朗讀。'); return; }
    speechSynthesis.cancel();
    this.queue = this.buildQueue();
    this.idx = 0;
    this.playing = true;
    this.paused = false;
    if (this.queue.length === 0) {
      this.setStatus('沒有可朗讀的內容。');
      this.playing = false;
      return;
    }
    this.setStatus(`自動朗讀中…（共 ${this.queue.length} 句）`);
    this.playNext();
  },

  playNext() {
    if (!this.playing) return;
    if (this.paused) return;
    if (this.idx >= this.queue.length) {
      this.playing = false;
      this.setStatus('✅ 自動朗讀完成。');
      return;
    }
    const item = this.queue[this.idx];
    this.idx++;

    const u = Speech.makeUtterance(item.text, item.lang);
    u.onend = () => {
      if (!this.playing) return;
      // 句子之間自然停頓
      setTimeout(() => {
        if (this.playing && !this.paused) this.playNext();
      }, 400);
    };
    u.onerror = () => {
      if (!this.playing) return;
      setTimeout(() => {
        if (this.playing && !this.paused) this.playNext();
      }, 200);
    };
    speechSynthesis.speak(u);
    this.setStatus(`朗讀中… ${this.idx} / ${this.queue.length}`);
  },

  pause() {
    if (!this.playing) return;
    this.paused = true;
    if (speechSynthesis.speaking && !speechSynthesis.paused) {
      speechSynthesis.pause();
    }
    this.setStatus('⏸ 已暫停。按「繼續」從原位繼續。');
  },

  resume() {
    if (!this.playing) {
      this.setStatus('尚未開始。請先按「開始自動朗讀」。');
      return;
    }
    this.paused = false;
    if (speechSynthesis.paused) {
      speechSynthesis.resume();
      this.setStatus(`朗讀中… ${this.idx} / ${this.queue.length}`);
    } else if (!speechSynthesis.speaking) {
      this.setStatus(`朗讀中… ${this.idx} / ${this.queue.length}`);
      this.playNext();
    }
  },

  stop() {
    this.playing = false;
    this.paused = false;
    this.idx = 0;
    this.queue = [];
    speechSynthesis.cancel();
    this.setStatus('⏹ 已停止。按「開始」會由頭開始。');
  }
};

document.getElementById('btnStart').addEventListener('click', () => Auto.start());
document.getElementById('btnPause').addEventListener('click', () => Auto.pause());
document.getElementById('btnResume').addEventListener('click', () => Auto.resume());
document.getElementById('btnStop').addEventListener('click', () => Auto.stop());

const modeJP = document.getElementById('modeJP');
const modeAll = document.getElementById('modeAll');
modeJP.addEventListener('click', () => {
  Auto.mode = 'jp';
  modeJP.classList.add('active');
  modeAll.classList.remove('active');
  Auto.setStatus('模式：只讀日文');
});
modeAll.addEventListener('click', () => {
  Auto.mode = 'all';
  modeAll.classList.add('active');
  modeJP.classList.remove('active');
  Auto.setStatus('模式：讀日文＋中文解說＋答案');
});

/* =======================================================================
   啟動
   ======================================================================= */
Speech.init();
renderAll();
</script>
